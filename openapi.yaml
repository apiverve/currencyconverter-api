openapi: 3.0.4
info:
  title: Currency Converter
  description: >-
    Currency Converter calculates foreign exchange conversions across 170+
    currencies using real-time rates. Pass an amount with source and target
    currency codes to receive the converted total, exchange rate, and 24-hour
    trend direction.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/currencyconverter:
    get:
      summary: Currency Converter
      description: Convert currency rates based on the amount and currency
      operationId: currencyconverter
      parameters:
        - name: value
          in: query
          schema:
            type: number
          required: true
          description: The amount to convert
          example: 1
        - name: from
          in: query
          schema:
            type: string
          required: true
          description: The ISO 4217 currency code to convert from
          example: USD
        - name: to
          in: query
          schema:
            type: string
          required: true
          description: The ISO 4217 currency code to convert to
          example: EUR
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional past date (YYYY-MM-DD) to use that day's closing rates
            instead of live rates. History runs from 1999-01-04 for about 30
            major currencies and covers every supported currency from March
            2024. A day with no rates, such as a weekend or holiday, uses the
            last close before it.
          example: '2025-06-02'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  from: USD
                  to: EUR
                  value: 1
                  convertedValue: 0.866496
                  rate: 0.866496
                  change24h: 0.000493
                  change24hPct: 0.0569
                  changeDirection: up
                  high24h: 0.866914
                  low24h: 0.865725
                  lastUpdated: '2026-09-15T21:00:17.674Z'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
